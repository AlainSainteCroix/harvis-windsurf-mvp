version: "0.1.0"
updated_at: "2026-04-09"

routing:
  default_agent: "cascade"

  rules:
    - match:
        task_type: "code_generation"
      route_to: "cascade"
      model_profile: "high_capability"

    - match:
        task_type: "code_review"
      route_to: "cascade"
      model_profile: "high_capability"

    - match:
        task_type: "analysis"
      route_to: "cascade"
      model_profile: "high_capability"

    - match:
        task_type: "refactor"
      route_to: "cascade"
      model_profile: "high_capability"

    - match:
        task_type: "validation"
      route_to: "cascade"
      model_profile: "fast"

    - match:
        task_type: "documentation"
      route_to: "cascade"
      model_profile: "fast"

    - match:
        risk: "high"
      require_authorization: true
      route_to: "cascade"
      model_profile: "high_capability"
